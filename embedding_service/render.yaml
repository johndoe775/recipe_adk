services:
  - type: web
    name: recipe-embedding
    runtime: python
    plan: starter
    pythonVersion: "3.12"
    rootDir: .
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: LOG_LEVEL
        value: INFO
      - key: EMBEDDING_MODEL
        value: sentence-transformers/all-MiniLM-L6-v2
